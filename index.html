<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You got mail</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fdf1e3;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0}
#env{position:absolute;left:50%;top:50%;width:260px;height:170px;margin:-60px 0 0 -130px;perspective:900px;z-index:1}
#env .back{position:absolute;inset:0;background:#e0b38a;border-radius:6px}
#env .front{position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,#f3cfa6 50%,transparent 50%) left/50% 100% no-repeat,linear-gradient(225deg,#f0c799 50%,transparent 50%) right/50% 100% no-repeat,linear-gradient(0deg,#ecbf90 55%,transparent 55%);z-index:3}
#env .flap{position:absolute;left:0;top:0;width:100%;height:60%;background:#d9a574;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .45s ease-in;z-index:4}
#env.open .flap{transform:rotateX(180deg);z-index:0}
.sticker{position:absolute;left:50%;top:50%;width:120px;height:auto;margin:-60px 0 0 -60px;border:5px solid #fff;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.25);background:#fff;z-index:2;opacity:0;pointer-events:none}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:#ffeb3b;color:#111;font-weight:900;font-size:clamp(22px,5vw,54px);line-height:1.2;text-align:center;padding:18px 26px;border:4px solid #111;width:min(90vw,900px);display:none;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <div id="env"><div class="back"></div><div class="flap"></div><div class="front"></div></div>
</div>
<div id="msg">AAP ITNI CHOTI AND BAATEIN ITNI BARI BARI LAGTA HAI AAP NE BACHPAN MEIN PEDIA SURE NAHI PIYA THA</div>
<script>
(function(){
var total=19;
var base='';
var stage=document.getElementById('stage');
var env=document.getElementById('env');
var msg=document.getElementById('msg');
var pad=function(n){return n<10?'0'+n:''+n};
var rand=function(a,b){return a+Math.random()*(b-a)};
var made=[];
for(var round=0;round<2;round++){
  for(var i=1;i<=total;i++){
    var im=document.createElement('img');
    im.className='sticker';
    im.alt='';
    im.dataset.n=pad(i);
    im.onerror=function(){
      if(base===''){base='hamster_memes/';this.src=base+'hamster_meme_'+this.dataset.n+'.jpg'}
    };
    im.src='hamster_meme_'+pad(i)+'.jpg';
    stage.appendChild(im);
    made.push(im);
  }
}
function launch(){
  var w=window.innerWidth,h=window.innerHeight;
  made.forEach(function(im,idx){
    var dx=rand(-w/2+90,w/2-90);
    var dy=rand(-h/2+90,h/2-90);
    var rot=rand(-40,40);
    var size=rand(.7,1.25);
    var delay=idx*18;
    im.animate([
      {opacity:1,transform:'translate(0,0) scale(.15) rotate(0deg)'},
      {opacity:1,transform:'translate('+dx+'px,'+dy+'px) scale('+size+') rotate('+rot+'deg)'}
    ],{duration:700,delay:delay,easing:'cubic-bezier(.2,.8,.3,1.2)',fill:'forwards'});
  });
}
function flash(){
  msg.style.display='block';
  setTimeout(function(){msg.style.display='none'},250);
}
setTimeout(function(){env.classList.add('open')},350);
setTimeout(launch,850);
setTimeout(flash,2400);
})();
</script>
</body>
</html>
